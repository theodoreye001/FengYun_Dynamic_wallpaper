<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地球图像显示</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <div class="earth-image"></div>
  </div>
  <script src="assets/wallpaper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var earthEl = document.querySelector('.earth-image');
      var earthUrl = getImageSource('https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/THUMBNAIL/FY4B_AGRI_DISK_GCLR.jpg');
      startAutoRefresh(earthEl, earthUrl);
    });
  </script>
</body>
</html>
