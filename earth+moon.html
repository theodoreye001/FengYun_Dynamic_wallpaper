<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地球和月球图像显示</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta http-equiv="refresh" content="1800">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .earth-image {
            width: 70vmin;
            height: 70vmin;
            border-radius: 50%;
            background-size: cover;
            margin-right: 5vmin;
        }
        .moon-image {
            position: absolute;
            width: 5vmin; /* 宽尺寸*/
            height: 5vmin; /* 高尺寸 */
            border-radius: 50%;
            background-size: cover;
            top: 8vmin; /* 地球的右上角 */
            right: 10vmin; /* 地球的右上角 */
            z-index: 2;
        }
        
        /* 竖屏布局 */
        @media (orientation: portrait) {
            .container {
                flex-direction: column;
                justify-content: center;
                align-items: flex-end;
            }
            .earth-image {
                margin-right: 5vmin;
                margin-bottom: 5vmin;
            }
            .moon-image {
                top: 10vmin;
                right: 10vmin; /* 地球的右上角 */
                left: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="moon-image"></div>
        <div class="earth-image"></div>
    </div>
    <script>
        function getMoonImageUrl() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const baseDate = new Date(`${currentYear}-01-01`);
            const baseNumber = 13;
            const daysDiff = Math.floor((now - baseDate) / (24 * 60 * 60 * 1000));
            const currentHourUTC = now.getUTCHours();
            const urlNumber = baseNumber + (daysDiff * 24 + currentHourUTC);
            let stringurlNumber = urlNumber.toString();
            while (stringurlNumber.length < 4) {
                stringurlNumber = '0' + stringurlNumber;
            }
            return `https://moon.nasa.gov/mvg.${currentYear}/${stringurlNumber}.jpg`;
        }

        function getEarthImageUrl() {
            return `https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/THUMBNAIL/FY4B_AGRI_DISK_GCLR.jpg?t=${Date.now()}`;
        }

        function updateEarthImage() {
            const earthImage = document.querySelector('.earth-image');
            earthImage.style.backgroundImage = `url(${getEarthImageUrl()})`;
        }

        function updateMoonImage() {
            const moonImage = document.querySelector('.moon-image');
            const url = getMoonImageUrl();
            const img = new Image();
            img.onload = function() {
                moonImage.style.backgroundImage = `url(${url})`;
            };
            img.onerror = function() {
                moonImage.style.display = 'none';
            };
            img.src = url;
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateEarthImage();
            updateMoonImage();

            // Refresh earth image every 30 minutes
            setInterval(updateEarthImage, 30 * 60 * 1000);
        });
    </script>
</body>
</html>
