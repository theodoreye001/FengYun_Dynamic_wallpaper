<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地球和月球图像显示</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .container {
      justify-content: flex-end;
    }
    .earth-image {
      margin-right: 5vmin;
    }
    .moon-image {
      position: absolute;
      width: 5vmin;
      height: 5vmin;
      border-radius: 50%;
      background-size: cover;
      top: 8vmin;
      right: 10vmin;
      z-index: 2;
    }
    @media (orientation: portrait) {
      .container {
        flex-direction: column;
        justify-content: center;
        align-items: flex-end;
      }
      .earth-image {
        margin-right: 5vmin;
        margin-bottom: 5vmin;
      }
      .moon-image {
        top: 10vmin;
        right: 10vmin;
        left: auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="moon-image"></div>
    <div class="earth-image"></div>
  </div>
  <script src="assets/wallpaper.js"></script>
  <script>
    function getMoonImageUrl() {
      var now = new Date();
      var currentYear = now.getFullYear();
      var baseDate = new Date(currentYear + '-01-01');
      // Offset constant derived from NASA Moon Visualization Gallery (moon.nasa.gov/mvg.YYYY/).
      // The gallery indexes hourly moon images starting from this offset at the beginning of each year.
      // If images fail to load, the moon div is hidden gracefully.
      var baseNumber = 13;
      var daysDiff = Math.floor((now - baseDate) / (24 * 60 * 60 * 1000));
      var currentHourUTC = now.getUTCHours();
      var urlNumber = baseNumber + (daysDiff * 24 + currentHourUTC);
      var stringurlNumber = urlNumber.toString();
      while (stringurlNumber.length < 4) {
        stringurlNumber = '0' + stringurlNumber;
      }
      return 'https://moon.nasa.gov/mvg.' + currentYear + '/' + stringurlNumber + '.jpg';
    }

    function updateMoonImage() {
      var moonImage = document.querySelector('.moon-image');
      var url = getMoonImageUrl();
      preloadImage(url).then(function () {
        moonImage.style.backgroundImage = 'url(' + url + ')';
      }).catch(function () {
        moonImage.style.display = 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', function () {
      var earthEl = document.querySelector('.earth-image');
      var earthUrl = getImageSource('https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/THUMBNAIL/FY4B_AGRI_DISK_GCLR.jpg');
      startAutoRefresh(earthEl, earthUrl);
      updateMoonImage();
    });
  </script>
</body>
</html>
