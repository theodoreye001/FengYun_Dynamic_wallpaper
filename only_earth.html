<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地球图像显示</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .container {
      flex-direction: column;
    }
    .time-display {
      color: rgba(255, 255, 255, 0.5);
      font-size: 1rem;
      margin-top: 10px;
      text-align: center;
    }
    @media (orientation: landscape) {
      .container {
        align-items: flex-end;
        padding-right: 6vw;
      }
      .earth-image-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="earth-image-wrapper">
      <div class="earth-image"></div>
      <div class="time-display"></div>
    </div>
  </div>
  <script src="assets/wallpaper.js"></script>
  <script>
    var imageUrl = getImageSource('https://img.nsmc.org.cn/CLOUDIMAGE/FY4B/AGRI/THUMBNAIL/FY4B_AGRI_DISK_GCLR.jpg');

    function updateTime() {
      var timeDisplay = document.querySelector('.time-display');
      var now = new Date();
      timeDisplay.textContent = now.toLocaleString('zh-CN');
    }

    document.addEventListener('DOMContentLoaded', function () {
      var earthEl = document.querySelector('.earth-image');
      startAutoRefresh(earthEl, imageUrl);
      updateTime();
      setInterval(updateTime, 60000);
    });
  </script>
</body>
</html>
